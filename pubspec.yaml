name: sosapp
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
    

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.4
  flutter_local_notifications: ^17.0.0
  http: 1.6.0
  speech_to_text: ^7.0.0
  vibration: ^2.0.0
  torch_light: ^1.1.0
  audioplayers: ^6.0.0
  geolocator: ^12.0.0
  wakelock_plus: ^1.5.1
  flutter_foreground_task: ^6.1.2
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.5
 
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1   # ✅ moved here

flutter:
  uses-material-design: true

  assets:
    - assets/icons/google_logo.png
    - assets/icon.png

# ✅ App Icon Config
flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"